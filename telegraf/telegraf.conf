# MQTT -> InfluxDB. Topic: unab/iot/<device_id>/telemetry
[agent]
  interval = "10s"
  flush_interval = "10s"
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  topics = ["unab/iot/+/telemetry"]
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry"
    timestamp_path = "ts"
    timestamp_format = "unix"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "kind"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "fields"
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
