server { listen 80; server_name _; return 301 https://$host$request_uri; }
server {
  listen 443 ssl;
  server_name _;
  # reemplaza iot-unab-miguel.spaincentral.cloudapp.azure.com por el FQDN real (nginx no expande variables aquí)
  ssl_certificate     /etc/letsencrypt/live/iot-unab-miguel.spaincentral.cloudapp.azure.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/iot-unab-miguel.spaincentral.cloudapp.azure.com/privkey.pem;
  location / { proxy_pass http://grafana:3000; proxy_set_header Host $host; }
  location /control/ { proxy_pass http://backend:8000/; proxy_set_header Host $host; }
}
